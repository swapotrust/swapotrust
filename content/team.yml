    more_en: "Also on the 2026 team: Manoj Agrawal (Raya wale) and Rakesh Bansal, District Senior Vice Presidents; Shrimohan Varshney and Deepak Gupta (Koyla wale), District Vice Presidents; Mohit Garg, District Organisation Secretary; Keshav Lal Arora and Ravi Varshney, City Senior Vice Presidents; Manish Goyal, City Vice President; Dr. Mohit Garg, in charge of the Medical Cell. Advisers include Govind Prasad Agrawal, Shrikishan Arora, Vijay Krishna Garg and Ashok Agrawal (Gorai wale)."
    more_hi: "2026 टीम में ये भी शामिल हैं: मनोज अग्रवाल (राया वाले) एवं राकेश बंसल, जिला वरिष्ठ उपाध्यक्ष; श्रीमोहन वार्ष्णेय एवं दीपक गुप्ता (कोयला वाले), जिला उपाध्यक्ष; मोहित गर्ग, जिला संगठन मंत्री; केशव लाल अरोड़ा एवं रवि वार्ष्णेय, नगर वरिष्ठ उपाध्यक्ष; मनीष गोयल, नगर उपाध्यक्ष; डॉ. मोहित गर्ग, प्रभारी चिकित्सा प्रकोष्ठ। संरक्षकों में गोविंद प्रसाद अग्रवाल, श्रीकिशन अरोड़ा, विजय कृष्ण गर्ग और अशोक अग्रवाल (गोरई वाले) शामिल हैं।"
